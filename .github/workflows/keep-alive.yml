name: Supabase keep-alive

# Supabase free-tier projects pause after ~7 days without activity. A real
# query against the database (not just the API root) counts as activity.

on:
  schedule:
    - cron: '17 3 */3 * *' # every 3 days, 03:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $status"
          cat response.json
          test "$status" = "200"
